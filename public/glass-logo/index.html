<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>GWI — interactive glass mark</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ovo&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#ffffff; }
  canvas { display:block; width:100%; height:100%; touch-action:none; }
  #loading {
    position:fixed; inset:0; z-index:10; display:flex; align-items:center; justify-content:center;
    color:rgba(0,0,0,0.35); font:12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    letter-spacing:0.08em; text-transform:uppercase; pointer-events:none;
  }
</style>
</head>
<body>
<div id="loading">loading glass mark…</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { SVGLoader } from 'three/addons/loaders/SVGLoader.js';

// The exact logo shape provided — used verbatim, only the fill color is irrelevant since the
// mesh's own material overrides it.
const SVG_SOURCE = `
<svg width="650" height="650" viewBox="0 0 650 650" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M415.906 300.644C395.114 223.049 421.457 177.366 499.085 156.565C576.719 135.763 622.376 162.154 643.168 239.749C663.958 317.343 637.613 363.025 559.979 383.827C482.352 404.626 436.697 378.236 415.906 300.644Z" fill="#FDFDFD"/>
<path d="M6.83408 410.251C-13.957 332.657 12.388 286.975 90.0221 266.173C91.7985 265.697 93.558 265.246 95.3009 264.82C119.572 258.884 142.716 245.671 154.549 223.663C165.444 203.399 164.822 179.122 158.295 157.06C157.701 155.049 157.124 153.001 156.565 150.917C135.763 73.2823 162.155 27.6255 239.749 6.83408C317.344 -13.957 363.025 12.3879 383.827 90.0221C404.627 167.65 378.237 213.304 300.644 234.096C299.986 234.272 299.331 234.445 298.678 234.614C273.685 241.099 249.93 254.934 237.702 277.677C226.459 298.588 226.886 323.602 233.302 346.461C233.57 347.418 233.835 348.383 234.096 349.356C234.195 349.726 234.293 350.095 234.39 350.463C241.017 375.646 255.009 399.564 277.944 411.895C299.027 423.231 324.235 422.852 347.304 416.464C347.984 416.275 348.668 416.089 349.356 415.904C426.951 395.113 472.634 421.455 493.435 499.084C514.237 576.718 487.846 622.375 410.251 643.166C332.657 663.957 286.975 637.612 266.173 559.978C265.62 557.915 265.101 555.875 264.615 553.858C258.815 529.771 245.754 506.783 223.933 495.05C203.832 484.241 179.739 484.909 157.877 491.462C155.605 492.143 153.285 492.8 150.917 493.435C73.2823 514.237 27.6255 487.846 6.83408 410.251Z" fill="#FDFDFD"/>
</svg>`;

// ---------- renderer / scene / camera ----------
const canvas = document.createElement('canvas');
document.body.appendChild(canvas);

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);

const camera = new THREE.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 0, 12);

// ---------- lights ----------
scene.add(new THREE.AmbientLight(0xffffff, 0.4));

const keyLight = new THREE.PointLight(0xffffff, 90, 60, 2);
keyLight.position.set(6, 7, 8);
scene.add(keyLight);

const fillLight = new THREE.PointLight(0xffffff, 50, 60, 2);
fillLight.position.set(-7, -3, 6);
scene.add(fillLight);

const rimLight = new THREE.PointLight(0xffffff, 40, 60, 2);
rimLight.position.set(0, -6, 5);
scene.add(rimLight);

// ---------- neutral studio environment (baked to PMREM), just for crisp reflections/highlights ----------
function buildEnvironment() {
  const envScene = new THREE.Scene();
  const geo = new THREE.PlaneGeometry(60, 60);
  const panels = [
    { color: '#ffffff', pos: [0, 0, -35], rot: [0, 0, 0] },
    { color: '#e2e2e2', pos: [35, 0, 0], rot: [0, -Math.PI / 2, 0] },
    { color: '#f4f4f4', pos: [-35, 0, 0], rot: [0, Math.PI / 2, 0] },
    { color: '#ffffff', pos: [0, 35, 0], rot: [Math.PI / 2, 0, 0] },
    { color: '#c9c9c9', pos: [0, -35, 0], rot: [-Math.PI / 2, 0, 0] },
  ];
  panels.forEach(p => {
    const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: p.color }));
    mesh.position.set(...p.pos);
    mesh.rotation.set(...p.rot);
    envScene.add(mesh);
  });
  const pmrem = new THREE.PMREMGenerator(renderer);
  pmrem.compileEquirectangularShader();
  const rt = pmrem.fromScene(envScene, 0.04);
  pmrem.dispose();
  return rt.texture;
}
scene.environment = buildEnvironment();

// ---------- backdrop: white plane with "HUMAN" in black, filling the whole frustum ----------
// There's only one fixed background this time (no per-page color switching), so the plane can
// safely cover the entire view — there's nothing behind it anywhere that ever needs to show
// through, which is what caused edge-artifact problems the last time this was built.
let backdropMesh = null;
const BACKDROP_Z = -3; // close behind the (thin) mark, so refraction bends the word without missing it

function buildBackdropTexture() {
  const width = 1600;
  const height = Math.round(width / camera.aspect);
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, width, height);
  ctx.fillStyle = '#000000';
  ctx.font = `${Math.round(width * 0.16)}px Ovo, serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('HUMAN', width / 2, height / 2);
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

// Scales the plane so it exactly fills the camera's frustum at its depth — no oversized margin.
function fitBackdropToView() {
  if (!backdropMesh) return;
  const distance = camera.position.z - BACKDROP_Z;
  const vFov = (camera.fov * Math.PI) / 180;
  const visibleHeight = 2 * Math.tan(vFov / 2) * distance;
  const visibleWidth = visibleHeight * camera.aspect;
  backdropMesh.scale.set(visibleWidth, visibleHeight, 1);
}

function buildBackdrop() {
  const geo = new THREE.PlaneGeometry(1, 1);
  const mat = new THREE.MeshBasicMaterial({ map: null, toneMapped: false });
  backdropMesh = new THREE.Mesh(geo, mat);
  backdropMesh.position.set(0, 0, BACKDROP_Z);
  scene.add(backdropMesh);
  fitBackdropToView();
}

function refreshBackdropTexture() {
  if (!backdropMesh) return;
  fitBackdropToView();
  const old = backdropMesh.material.map;
  backdropMesh.material.map = buildBackdropTexture();
  backdropMesh.material.needsUpdate = true;
  if (old) old.dispose();
}

// ---------- build the glass mark from the exact SVG shape ----------
const pivot = new THREE.Group();
scene.add(pivot);

function buildMark() {
  const loader = new SVGLoader();
  const svgData = loader.parse(SVG_SOURCE);

  const material = new THREE.MeshPhysicalMaterial({
    color: 0xffffff,
    metalness: 0,
    roughness: 0.05,      // crystal-clear, sharp reflections
    transmission: 1,
    thickness: 2.2,        // how strongly the refracted word shifts/warps as the mark tilts
    ior: 1.5,
    clearcoat: 0.7,
    clearcoatRoughness: 0.05,
    specularIntensity: 0.8,
    envMapIntensity: 1.2,
    attenuationColor: new THREE.Color('#ffffff'),
    attenuationDistance: 30,
    side: THREE.DoubleSide, // see both the near and far interior surfaces through the shape
  });

  const content = new THREE.Group();

  svgData.paths.forEach(path => {
    const shapes = SVGLoader.createShapes(path);
    shapes.forEach(shape => {
      const geometry = new THREE.ExtrudeGeometry(shape, {
        depth: 70,
        bevelEnabled: true,
        bevelThickness: 34, // bevel covers most of the depth -> a proper dome/lens face, not a flat disc
        bevelSize: 30,
        bevelSegments: 18,
        curveSegments: 32,
      });
      geometry.computeVertexNormals();
      const mesh = new THREE.Mesh(geometry, material);
      content.add(mesh);
    });
  });

  // center the mark on its own local origin
  const box = new THREE.Box3().setFromObject(content);
  const center = box.getCenter(new THREE.Vector3());
  content.children.forEach(m => m.position.sub(center));

  // fit to a consistent on-screen size regardless of source units
  const size = box.getSize(new THREE.Vector3());
  const scale = 3.6 / Math.max(size.x, size.y);
  content.scale.set(scale, -scale, scale); // flip Y: SVG space -> GL space

  pivot.add(content);
}

buildBackdrop();
buildMark();
document.fonts.load('260px Ovo').catch(() => {}).finally(() => {
  refreshBackdropTexture();
  document.getElementById('loading').remove();
});

// ---------- mouse-driven motion ----------
const mouse = new THREE.Vector2(0, 0);
const targetRot = new THREE.Vector2(0, 0);
const targetPos = new THREE.Vector2(0, 0);
let idle = 0;

function onPointerMove(x, y) {
  mouse.x = (x / window.innerWidth) * 2 - 1;
  mouse.y = (y / window.innerHeight) * 2 - 1;
}
window.addEventListener('pointermove', e => onPointerMove(e.clientX, e.clientY));
window.addEventListener('touchmove', e => {
  if (e.touches[0]) onPointerMove(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: true });

function resize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  refreshBackdropTexture();
}
window.addEventListener('resize', resize);

function animate() {
  requestAnimationFrame(animate);
  idle += 0.0035;

  targetRot.x = -mouse.y * 0.55;
  targetRot.y = mouse.x * 0.7 + Math.sin(idle) * 0.08;
  targetPos.x = mouse.x * 1.4;
  targetPos.y = -mouse.y * 0.9 + Math.sin(idle * 1.3) * 0.15;

  pivot.rotation.x += (targetRot.x - pivot.rotation.x) * 0.06;
  pivot.rotation.y += (targetRot.y - pivot.rotation.y) * 0.06;
  pivot.position.x += (targetPos.x - pivot.position.x) * 0.08;
  pivot.position.y += (targetPos.y - pivot.position.y) * 0.08;

  keyLight.position.x = 6 + mouse.x * 2;
  keyLight.position.y = 7 - mouse.y * 2;

  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
